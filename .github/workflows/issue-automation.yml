name: Issue Management Automation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  issue-triage:
    name: Triage and label new issues
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    outputs:
      priority: ${{ steps.classify.outputs.priority }}
      category: ${{ steps.classify.outputs.category }}
      is_epic: ${{ steps.classify.outputs.is_epic }}
      is_bug: ${{ steps.classify.outputs.is_bug }}
      is_maintenance: ${{ steps.classify.outputs.is_maintenance }}
    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'bug',                    color: 'd73a4a', description: "Something isn't working" },
              { name: 'enhancement',            color: 'a2eeef', description: 'New feature or request' },
              { name: 'epic',                   color: '7057ff', description: 'Large feature requiring multiple sub-tasks' },
              { name: 'maintenance',            color: 'fbca04', description: 'Maintenance and housekeeping tasks' },
              { name: 'priority-critical',      color: 'b60205', description: 'Critical priority issue' },
              { name: 'priority-high',          color: 'd93f0b', description: 'High priority issue' },
              { name: 'priority-medium',        color: 'fbca04', description: 'Medium priority issue' },
              { name: 'priority-low',           color: '0e8a16', description: 'Low priority issue' },
              { name: 'needs-triage',           color: 'ededed', description: 'Needs to be reviewed by maintainers' },
              { name: 'needs-review',           color: 'cccccc', description: 'Awaiting review from maintainers' },
              { name: 'first-time-contributor', color: '7057ff', description: 'Issue created by first-time contributor' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (err) {
                if (err.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description,
                    });
                    core.info(`Created label: ${label.name}`);
                  } catch (createErr) {
                    core.warning(`Could not create label ${label.name}: ${createErr.message}`);
                  }
                } else {
                  core.warning(`Error checking label ${label.name}: ${err.message}`);
                }
              }
            }

      - name: Classify and apply labels
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const combined = title + '\n' + body;

            const labelsToAdd = ['needs-triage'];

            // Category labels (from title)
            let category = '';
            let isBug = false, isEpic = false, isMaintenance = false;
            if (title.includes('bug')) { labelsToAdd.push('bug'); category = 'bug'; isBug = true; }
            if (title.includes('epic')) { labelsToAdd.push('epic'); category = category || 'epic'; isEpic = true; }
            if (title.includes('maintenance')) { labelsToAdd.push('maintenance'); category = category || 'maintenance'; isMaintenance = true; }

            // Priority detection (title OR body, case-insensitive, highest wins)
            const criticalKeywords = ['critical', 'urgent', 'production', 'outage'];
            const highKeywords     = ['important', 'high', 'blocking'];
            const mediumKeywords   = ['medium', 'normal'];
            const lowKeywords      = ['low', 'nice-to-have', 'minor'];

            const matchAny = (kws) => kws.some(k => combined.includes(k));

            let priority;
            if (matchAny(criticalKeywords))      priority = 'priority-critical';
            else if (matchAny(highKeywords))     priority = 'priority-high';
            else if (matchAny(mediumKeywords))   priority = 'priority-medium';
            else if (matchAny(lowKeywords))      priority = 'priority-low';
            else                                  priority = 'priority-medium';

            labelsToAdd.push(priority);

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd,
              });
            } catch (err) {
              core.warning(`Could not add labels: ${err.message}`);
            }

            core.setOutput('priority', priority);
            core.setOutput('category', category);
            core.setOutput('is_epic', isEpic ? 'true' : 'false');
            core.setOutput('is_bug', isBug ? 'true' : 'false');
            core.setOutput('is_maintenance', isMaintenance ? 'true' : 'false');

  task-breakdown:
    name: Break Epic into sub-tasks
    needs: issue-triage
    runs-on: ubuntu-latest
    if: needs.issue-triage.outputs.is_epic == 'true'
    steps:
      - name: Create 4 sub-issues and update parent
        uses: actions/github-script@v7
        with:
          script: |
            const parent = context.payload.issue;
            const taskNames = [
              'Requirements Analysis',
              'Design and Architecture',
              'Implementation',
              'Testing and Documentation',
            ];

            const subIssueNumbers = [];
            for (let i = 0; i < taskNames.length; i++) {
              const taskNum = i + 1;
              const taskName = taskNames[i];
              const subTitle = `[SUBTASK] ${parent.title} - Task ${taskNum}: ${taskName}`;
              const subBody = [
                `Sub-task **${taskNum}** of epic **#${parent.number}**: ${taskName}.`,
                ``,
                `Related to #${parent.number}`,
              ].join('\n');

              try {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: subTitle,
                  body: subBody,
                  labels: ['enhancement', 'needs-review'],
                });
                subIssueNumbers.push(created.data.number);
                core.info(`Created sub-issue #${created.data.number}: ${subTitle}`);
              } catch (err) {
                core.warning(`Failed to create sub-issue ${taskNum}: ${err.message}`);
              }
            }

            // Build Epic Tasks checklist appended to parent body
            const checklistLines = subIssueNumbers.map(
              (n, i) => `- [ ] Task ${i + 1}: ${taskNames[i]} (#${n})`
            );
            const checklistSection = [
              '',
              '',
              '## Epic Tasks',
              '',
              ...checklistLines,
              '',
            ].join('\n');

            const originalBody = parent.body || '';
            const newBody = originalBody.includes('## Epic Tasks')
              ? originalBody
              : originalBody + checklistSection;

            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parent.number,
                body: newBody,
              });
            } catch (err) {
              core.warning(`Failed to update parent body: ${err.message}`);
            }

  auto-response:
    name: Welcome and respond
    needs: [issue-triage, task-breakdown]
    if: |
      always() &&
      needs.issue-triage.result == 'success' &&
      (needs.task-breakdown.result == 'success' || needs.task-breakdown.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Post auto-response, set milestone, and update status
        uses: actions/github-script@v7
        env:
          PRIORITY: ${{ needs.issue-triage.outputs.priority }}
          IS_BUG: ${{ needs.issue-triage.outputs.is_bug }}
          IS_EPIC: ${{ needs.issue-triage.outputs.is_epic }}
          IS_MAINTENANCE: ${{ needs.issue-triage.outputs.is_maintenance }}
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            const priority = process.env.PRIORITY || 'priority-medium';
            const isBug = process.env.IS_BUG === 'true';
            const isEpic = process.env.IS_EPIC === 'true';
            const isMaintenance = process.env.IS_MAINTENANCE === 'true';

            // 1. First-issue-in-repo detection (per repo, not per GitHub account)
            let isFirstInRepo = false;
            try {
              const issuesByAuthor = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  creator: author,
                  per_page: 100,
                }
              );
              const onlyIssues = issuesByAuthor.filter(i => !i.pull_request);
              isFirstInRepo = onlyIssues.length <= 1;
            } catch (err) {
              core.warning(`Could not list issues for author: ${err.message}`);
            }

            if (isFirstInRepo) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['first-time-contributor'],
                });
              } catch (err) {
                core.warning(`Could not add first-time-contributor label: ${err.message}`);
              }
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: [
                    `👋 Welcome @${author}! Thank you for opening your **first issue** in this repository.`,
                    ``,
                    `We appreciate your contribution. A maintainer will review this shortly.`,
                  ].join('\n'),
                });
              } catch (err) {
                core.warning(`Could not post welcome comment: ${err.message}`);
              }
            }

            // 2. Type-specific guidance comment
            let typeMessage = null;
            if (isBug) {
              typeMessage = [
                `## Bug Report Guidelines`,
                ``,
                `Thanks for reporting this bug. To help us resolve it efficiently, please ensure your report includes:`,
                ``,
                `- Clear steps to reproduce`,
                `- Expected vs. actual behavior`,
                `- Environment details (OS, Node.js version, browser if applicable)`,
                `- Relevant logs, stack traces, or screenshots`,
                ``,
                `A maintainer will triage this report and respond as soon as possible.`,
              ].join('\n');
            } else if (isEpic) {
              typeMessage = [
                `## Feature Request Process`,
                ``,
                `Thanks for proposing this epic! As part of our automated workflow, this issue has been broken down into 4 sub-tasks:`,
                ``,
                `1. Requirements Analysis`,
                `2. Design and Architecture`,
                `3. Implementation`,
                `4. Testing and Documentation`,
                ``,
                `Please review the **Epic Tasks** checklist appended to the issue body and assign owners to each sub-task as appropriate.`,
              ].join('\n');
            } else if (isMaintenance) {
              typeMessage = [
                `## Maintenance Guidelines`,
                ``,
                `Thanks for opening this maintenance issue. Please describe:`,
                ``,
                `- Scope of cleanup, refactor, or housekeeping work`,
                `- Risk assessment and any backwards-compatibility considerations`,
                `- Testing strategy to validate changes`,
                ``,
                `Maintenance tasks are typically picked up during the next dedicated maintenance window.`,
              ].join('\n');
            }

            if (typeMessage) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: typeMessage,
                });
              } catch (err) {
                core.warning(`Could not post type-specific comment: ${err.message}`);
              }
            }

            // 3. Set milestone v1.0.0 for high/critical priority
            if (priority === 'priority-high' || priority === 'priority-critical') {
              try {
                let milestone = null;
                const ms = await github.paginate(github.rest.issues.listMilestones, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  per_page: 100,
                });
                milestone = ms.find(m => m.title === 'v1.0.0');
                if (!milestone) {
                  const created = await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'v1.0.0',
                    description: 'Initial release milestone',
                  });
                  milestone = created.data;
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  milestone: milestone.number,
                });
              } catch (err) {
                core.warning(`Could not set milestone: ${err.message}`);
              }
            }

            // 4. Status transition: needs-triage -> needs-review
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'needs-triage',
              });
            } catch (err) {
              if (err.status !== 404) {
                core.warning(`Could not remove needs-triage label: ${err.message}`);
              }
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-review'],
              });
            } catch (err) {
              core.warning(`Could not add needs-review label: ${err.message}`);
            }
